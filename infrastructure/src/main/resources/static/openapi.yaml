openapi: 3.0.3
info:
  title: MessageUcoLab API
  description: API para crear tokens y consultar mensajes por ambiente.
  version: 1.0.0

servers:
  - url: /
    description: Servidor actual

security:
  - tokenAuth: []

tags:
  - name: Tokens
    description: Creacion de tokens de acceso.
  - name: Mensajes
    description: Consulta y traduccion de mensajes.
  - name: Contexto
    description: Consulta y seleccion del contexto activo de la identidad autenticada.
  - name: Catalogos
    description: Catalogos con identificadores UUID persistentes.
  - name: Administracion
    description: Creacion de aplicaciones, ambientes y funcionalidades.

paths:
  /messageucolab/v1/application:
    post:
      tags: [Administracion]
      summary: Crear aplicacion
      description: Crea una aplicacion asociada a una organizacion. El contrato no recibe fechas de inicio o fin.
      operationId: createApplication
      security:
        - tokenAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '200':
          description: Aplicacion creada correctamente.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/application/environment:
    post:
      tags: [Administracion]
      summary: Crear ambiente
      description: Crea un ambiente identificado para el usuario por su tipo. Cada aplicacion admite como maximo un ambiente de cada tipo; no se recibe un nombre independiente.
      operationId: createEnvironment
      security:
        - tokenAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '200':
          description: Ambiente creado correctamente.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/application/functionality:
    post:
      tags: [Administracion]
      summary: Crear funcionalidad
      description: Crea una funcionalidad para una aplicacion. El contrato no recibe fechas de inicio o fin.
      operationId: createFunctionality
      security:
        - tokenAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionalityRequest'
      responses:
        '200':
          description: Funcionalidad creada correctamente.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/application/message:
    post:
      tags: [Mensajes]
      summary: Crear mensaje
      description: Crea un mensaje en el ambiente del contexto activo. Todos los campos terminados en Id aceptan exclusivamente UUID persistentes. El cliente envia applicationId, no el nombre de la aplicacion; el nombre expuesto en las salidas se deriva en el servidor.
      operationId: createMessage
      security:
        - tokenAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: Mensaje creado correctamente.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/application/{id}/token:
    post:
      tags: [Tokens]
      summary: Crear token de aplicacion
      description: Crea un token para autenticar solicitudes de una aplicacion en un ambiente.
      operationId: createToken
      security: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/TokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/application/messages:
    get:
      tags: [Mensajes]
      summary: Listar mensajes por ambiente
      description: Retorna los mensajes paginados del ambiente legado o del contexto activo de la identidad.
      operationId: findMessagesByEnvironment
      security:
        - tokenAuth: []
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero de pagina, empezando en 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Cantidad de elementos por pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: sort
          in: query
          description: Direccion de ordenamiento.
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
        - name: columnSort
          in: query
          description: Campo usado para ordenar.
          schema:
            type: string
            default: id
      responses:
        '200':
          $ref: '#/components/responses/MessagesFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/application/messages/{messageCode}:
    get:
      tags: [Mensajes]
      summary: Buscar mensaje por codigo
      description: Obtiene un mensaje por codigo dentro del ambiente legado o del contexto activo de la identidad.
      operationId: findMessageByCode
      security:
        - tokenAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageCode'
      responses:
        '200':
          $ref: '#/components/responses/MessageFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/application/messages/{messageCode}/translation:
    get:
      tags: [Mensajes]
      summary: Traducir mensaje
      description: Traduce un mensaje del ambiente legado o del contexto activo de la identidad sin guardar la traduccion.
      operationId: translateMessageByCode
      security:
        - tokenAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageCode'
        - name: sourceLanguage
          in: query
          description: Idioma origen. Por defecto se detecta automaticamente.
          schema:
            type: string
            default: auto
            example: auto
        - name: targetLanguage
          in: query
          required: true
          description: Idioma destino.
          schema:
            type: string
            example: en
      responses:
        '200':
          $ref: '#/components/responses/MessageTranslated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/me/contexts:
    get:
      tags: [Contexto]
      summary: Listar contextos disponibles
      description: Retorna los contextos que la identidad autenticada puede seleccionar.
      operationId: findAvailableContexts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contextos disponibles obtenidos correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableContextsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/message-types:
    get:
      tags: [Catalogos]
      summary: Listar tipos de mensaje
      operationId: findMessageTypes
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'

  /messageucolab/v1/catalog/message-categories:
    get:
      tags: [Catalogos]
      summary: Listar categorias de mensaje
      operationId: findMessageCategories
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'

  /messageucolab/v1/catalog/message-states:
    get:
      tags: [Catalogos]
      summary: Listar estados de mensaje
      operationId: findMessageStates
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'

  /messageucolab/v1/catalog/message-environment-states:
    get:
      tags: [Catalogos]
      summary: Listar estados de mensaje por ambiente
      operationId: findMessageEnvironmentStates
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'

  /messageucolab/v1/me/context:
    get:
      tags: [Contexto]
      summary: Consultar contexto activo
      description: Retorna el contexto activo de la identidad autenticada.
      operationId: findActiveContext
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contexto activo obtenido correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveContextResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Contexto]
      summary: Seleccionar contexto activo
      description: Valida y guarda el contexto activo de la identidad autenticada.
      operationId: selectActiveContext
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectActiveContextRequest'
      responses:
        '200':
          description: Contexto activo seleccionado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Token
      description: Token asociado a la aplicacion y al ambiente.
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Bearer de la identidad externa.

  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      description: Identificador unico de la aplicacion.
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
    MessageCode:
      name: messageCode
      in: path
      required: true
      description: Codigo del mensaje.
      schema:
        type: string
        example: MSG_001

  responses:
    TokenCreated:
      description: Token creado correctamente.
    MessagesFound:
      description: Mensajes obtenidos correctamente.
    MessageFound:
      description: Mensaje encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    MessageTranslated:
      description: Mensaje traducido correctamente.
    CatalogFound:
      description: Catalogo obtenido correctamente. Cada id es un UUID persistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogResponse'
    BadRequest:
      description: Solicitud o parametros invalidos.
    Unauthorized:
      description: La identidad no esta autenticada.
    Forbidden:
      description: Token ausente, invalido o sin autorizacion.
    NotFound:
      description: Recurso no encontrado.
    NotAcceptable:
      description: Formato de respuesta no soportado.
    Conflict:
      description: El recurso no respeta la jerarquia requerida.
    UnprocessableEntity:
      description: Los identificadores no cumplen las reglas de validacion.
    InternalServerError:
      description: Error interno del servidor.

  schemas:
    CreateApplicationRequest:
      type: object
      required: [name, organizationId, languageId, stateId]
      properties:
        name:
          type: string
        organizationId:
          type: string
          format: uuid
        languageId:
          type: string
          format: uuid
        stateId:
          type: string
          format: uuid
    CreateEnvironmentRequest:
      type: object
      required: [applicationId, typeId, stateId]
      properties:
        applicationId:
          type: string
          format: uuid
        typeId:
          type: string
          format: uuid
          description: Tipo que identifica y etiqueta el ambiente dentro de la aplicacion.
        stateId:
          type: string
          format: uuid
    CreateFunctionalityRequest:
      type: object
      required: [name, applicationId, stateId]
      properties:
        name:
          type: string
        applicationId:
          type: string
          format: uuid
        stateId:
          type: string
          format: uuid
    CreateMessageRequest:
      type: object
      required: [code, title, content, typeId, categoryId, statusId, applicationId,
        functionalityId, environmentId, messageEnvironmentStateId]
      properties:
        code:
          type: string
          example: DEMO_WELCOME
        title:
          type: string
          example: Welcome message
        content:
          type: string
          example: Welcome to MessageUcoLab
        typeId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        statusId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        functionalityId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        messageEnvironmentStateId:
          type: string
          format: uuid
    Message:
      type: object
      required: [code, title, content, type, category, application, functionality]
      properties:
        code:
          type: string
        title:
          type: string
        content:
          type: string
        type:
          type: string
        category:
          type: string
        application:
          type: string
          description: Nombre de la aplicacion derivado por el servidor a partir de applicationId.
        functionality:
          type: string
    MessageResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        errors:
          type: array
          items:
            type: string
    CreateTokenRequest:
      type: object
      required: [expirationDate, environmentId]
      properties:
        expirationDate:
          type: string
          format: date-time
          description: Fecha y hora de expiracion. Sin offset se interpreta como UTC; cualquier offset se normaliza a UTC.
          example: '2026-12-31T23:59:59Z'
        environmentId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174111
    SelectActiveContextRequest:
      type: object
      required: [organizationId, applicationId, environmentId]
      properties:
        organizationId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
    ActiveContext:
      allOf:
        - $ref: '#/components/schemas/SelectActiveContextRequest'
        - type: object
          required: [updatedAt]
          properties:
            updatedAt:
              type: string
              format: date-time
    AvailableContext:
      type: object
      required: [organization, application, environment]
      properties:
        organization:
          $ref: '#/components/schemas/CatalogItem'
        application:
          $ref: '#/components/schemas/CatalogItem'
        environment:
          $ref: '#/components/schemas/CatalogItem'
    CatalogItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CatalogResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        errors:
          type: array
          items:
            type: string
    AvailableContextsResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AvailableContext'
        errors:
          type: array
          items:
            type: string
    ActiveContextResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActiveContext'
        errors:
          type: array
          items:
            type: string
