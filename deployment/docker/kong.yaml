_format_version: "3.0"

services:
  - name: message-service
    url: http://host.docker.internal:${MESSAGEUCOLAB_PORT}
    routes:
      - name: messageucolab-api
        paths:
          - /messageucolab/v1
        strip_path: false

      - name: messageucolab-health
        paths:
          - /actuator/health
        methods:
          - GET
        strip_path: false

      - name: messageucolab-swagger
        paths:
          - /swagger-ui
          - /swagger-ui.html
          - /openapi.yaml
          - /v3/api-docs
        methods:
          - GET
        strip_path: false
