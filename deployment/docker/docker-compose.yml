services:

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - observability-network

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    networks:
      - observability-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.40.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - observability-network

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    networks:
      - observability-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "${REDISPORT}:${REDISPORT}"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --port
      - "${REDISPORT}"
      - --requirepass
      - "${REDISPASSWORD}"
      - --appendonly
      - "yes"
    networks:
      - observability-network
      - kong-network
      - app-network

  surrealdb:
    image: surrealdb/surrealdb:v2.1.4
    container_name: surrealdb-messageucolab
    user: "0:0"
    ports:
      - "8005:8005"
    environment:
      SURREAL_AUTH: "true"
      SURREAL_USER: ${SURREALDBUSER}
      SURREAL_PASS: ${SURREALDBPASSWORD}
    volumes:
      - surrealdb-data:/data
    command: >
      start
      --bind 0.0.0.0:8005
      --user ${SURREALDBUSER}
      --pass ${SURREALDBPASSWORD}
      surrealkv:/data/database.db
    healthcheck:
      test:
        [
          "CMD",
          "/surreal",
          "is-ready",
          "--endpoint",
          "ws://localhost:8005"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability-network
      - app-network

  surrealdb-init:
    image: surrealdb/surrealdb:v2.1.4
    container_name: surrealdb-init-messageucolab
    depends_on:
      surrealdb:
        condition: service_healthy
    entrypoint: ["/surreal"]
    command:
      - import
      - --endpoint
      - http://surrealdb:8005
      - --username
      - ${SURREALDBUSER}
      - --password
      - ${SURREALDBPASSWORD}
      - --namespace
      - ${SURREALDBNAMESPACE}
      - --database
      - ${SURREALDBDATABASE}
      - /init/surreal-init.surql
    volumes:
      - ./scripts:/init:ro
    restart: "no"
    networks:
      - app-network

  kong:
    image: kong/kong-gateway:3.5
    container_name: api-gateway-kong
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yaml:/kong/kong.yaml
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - kong-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: pull ${TRANSLATION_AI_MODEL_NAME:-llama3.2}
    restart: "no"
    networks:
      - app-network

  messageucolab:
    build:
      context: ../..
      dockerfile: Dockerfile

    container_name: messageucolab-app

    ports:
      - "8085:8085"

    environment:
      LOG_PATH: /app/logs

      # Redis
      REDISHOST: ${REDISHOST}
      REDISPORT: ${REDISPORT}
      REDISPASSWORD: ${REDISPASSWORD}
      REDISDATABASE: ${REDISDATABASE}

      # SurrealDB
      SURREALDBHOST: ${SURREALDBHOST}
      SURREALDBPORT: ${SURREALDBPORT}
      SURREALDBUSER: ${SURREALDBUSER}
      SURREALDBPASSWORD: ${SURREALDBPASSWORD}
      SURREALDBNAMESPACE: ${SURREALDBNAMESPACE}
      SURREALDBDATABASE: ${SURREALDBDATABASE}

      # Azure
      AZURE_KEYVAULT_UCOLAB_ENDPOINT: ${AZURE_KEYVAULT_UCOLAB_ENDPOINT}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}

      # Translation AI
      TRANSLATION_AI_ENABLED: ${TRANSLATION_AI_ENABLED:-true}
      TRANSLATION_AI_PROVIDER: ${TRANSLATION_AI_PROVIDER:-ollama}
      TRANSLATION_AI_API_KEY: ${TRANSLATION_AI_API_KEY:-}
      TRANSLATION_AI_BASE_URL: ${TRANSLATION_AI_BASE_URL:-http://ollama:11434}
      TRANSLATION_AI_MODEL_NAME: ${TRANSLATION_AI_MODEL_NAME:-llama3.2}
      TRANSLATION_AI_TEMPERATURE: ${TRANSLATION_AI_TEMPERATURE:-0.1}
      TRANSLATION_AI_MAX_RETRIES: ${TRANSLATION_AI_MAX_RETRIES:-0}
      TRANSLATION_AI_TIMEOUT_SECONDS: ${TRANSLATION_AI_TIMEOUT_SECONDS:-30}

      # Doppler
      DOPPLERTOKEN: ${DOPPLERTOKEN}

      # Pulsar
      PULSARURL: ${PULSARURL}
      PULSARTOPICNAME: ${PULSARTOPICNAME}



    volumes:
      - ../../logs:/app/logs

    depends_on:
      redis:
        condition: service_started
      pulsar:
        condition: service_started
      surrealdb:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

    networks:
      - observability-network
      - kong-network
      - app-network
      - pulsar-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8085/actuator/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pulsar:
    image: apachepulsar/pulsar:3.2.2
    container_name: pulsar-standalone
    command: >
      /bin/bash -c "
      bin/apply-config-from-env.py conf/standalone.conf &&
      bin/apply-config-from-env.py conf/client.conf &&
      bin/pulsar standalone -nss -nfw"
    ports:
      - "6800:6650"
      - "8080:8080"
    volumes:
      - pulsar-data:/pulsar/data
      - pulsar-conf:/pulsar/conf
    environment:
      PULSAR_MEM: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=2g"
      PULSAR_PREFIX_allowAutoTopicCreationType: "partitioned"
    networks:
      - pulsar-network
      - app-network


volumes:
  grafana-data:

  redis_data:
    driver: local

  loki-data:

  pulsar-data:
    driver: local

  pulsar-conf:
    driver: local

  surrealdb-data:
    driver: local

  ollama-data:
    driver: local


networks:
  observability-network:
    driver: bridge

  kong-network:
    driver: bridge

  app-network:
    driver: bridge

  pulsar-network:
    driver: bridge