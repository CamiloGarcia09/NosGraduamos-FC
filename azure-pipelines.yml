trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

parameters:
  - name: operation
    displayName: Pipeline operation
    type: string
    default: ci
    values:
      - ci
      - deploy
      - stop

pool:
  vmImage: ubuntu-latest

variables:
  - group: messageucolab-cicd
  - name: MAVEN_CACHE_FOLDER
    value: $(Pipeline.Workspace)/.m2/repository
  - name: IMAGE_REPOSITORY
    value: messageucolab
  - name: IMAGE_TAG
    value: $(Build.SourceVersion)
  - name: DEPLOY_ROOT
    value: /opt/messageucolab
  - name: DOPPLER_DEPLOY_TOKEN_SECRET
    value: doppler-deploy-token
  - name: DOPPLER_APP_TOKEN_SECRET
    value: doppler-app-token

stages:
  - stage: ValidateAndTest
    displayName: Validate, test and build
    condition: ne('${{ parameters.operation }}', 'stop')
    jobs:
      - job: CI
        displayName: Maven and container validation
        steps:
          - checkout: self
            clean: true

          - task: JavaToolInstaller@0
            displayName: Use Java 17
            inputs:
              versionSpec: "17"
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - bash: |
              set -euo pipefail
              java -version
              mvn -version
              docker version
            displayName: Validate tools

          - task: Cache@2
            displayName: Cache Maven dependencies
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(MAVEN_CACHE_FOLDER)

          - bash: |
              set -euo pipefail
              mvn -B clean verify "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)"
            displayName: Build and test

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "**/surefire-reports/TEST-*.xml"
              searchFolder: $(System.DefaultWorkingDirectory)
              mergeTestResults: true
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: false

          - bash: |
              set -euo pipefail
              docker compose --file deployment/azure/docker-compose.yml config --quiet
            displayName: Validate Azure Docker Compose
            env:
              ACR_LOGIN_SERVER: example.azurecr.io
              IMAGE_TAG: validation
              AZURE_KEYVAULT_UCOLAB_ENDPOINT: https://example.vault.azure.net
              DOPPLERTOKEN: validation
              REDISPASSWORD: validation
              PULSARTOPICNAME: persistent://public/default/validation
              SURREALDBUSER: root
              SURREALDBPASSWORD: validation
              SURREALDBNAMESPACE: messageucolab
              SURREALDBDATABASE: messageucolab

          - bash: |
              set -euo pipefail
              az bicep build --file infrastructure/azure/main.bicep --stdout >/dev/null
            displayName: Validate Bicep

          - bash: |
              set -euo pipefail
              docker build --tag "$(IMAGE_REPOSITORY):ci-$(Build.BuildId)" .
            displayName: Validate application image

          - task: AzureCLI@2
            displayName: Build and push application image
            condition: >-
              and(
                succeeded(),
                ne(variables['Build.Reason'], 'PullRequest'),
                or(
                  eq(variables['Build.SourceBranch'], 'refs/heads/develop'),
                  eq('${{ parameters.operation }}', 'deploy')
                )
              )
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                login_server="$(ACR_NAME).azurecr.io"
                commit_image="${login_server}/$(IMAGE_REPOSITORY):$(IMAGE_TAG)"
                build_image="${login_server}/$(IMAGE_REPOSITORY):build-$(Build.BuildId)"
                az acr login --name "$(ACR_NAME)"
                docker tag "$(IMAGE_REPOSITORY):ci-$(Build.BuildId)" "$commit_image"
                docker tag "$(IMAGE_REPOSITORY):ci-$(Build.BuildId)" "$build_image"
                docker push "$commit_image"
                docker push "$build_image"

  - stage: DeployDemo
    displayName: Deploy demo environment
    dependsOn: ValidateAndTest
    condition: >-
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq('${{ parameters.operation }}', 'deploy')
      )
    jobs:
      - job: Deploy
        displayName: Deploy to the temporary VM
        steps:
          - checkout: self
            clean: true

          - task: DownloadSecureFile@1
            name: sshKey
            displayName: Download temporary SSH key
            inputs:
              secureFile: $(SSH_SECURE_FILE)

          - task: AzureCLI@2
            displayName: Start VM and open temporary SSH access
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                agent_ip="$(curl --fail --silent https://api.ipify.org)"
                az vm start --resource-group "$(AZURE_RESOURCE_GROUP)" --name "$(AZURE_VM_NAME)"
                public_ip="$(az vm list-ip-addresses --resource-group "$(AZURE_RESOURCE_GROUP)" --name "$(AZURE_VM_NAME)" --query '[0].virtualMachine.network.publicIpAddresses[0].ipAddress' --output tsv)"
                echo "##vso[task.setvariable variable=VM_PUBLIC_IP]${public_ip}"
                az network nsg rule create \
                  --resource-group "$(AZURE_RESOURCE_GROUP)" \
                  --nsg-name "$(AZURE_NSG_NAME)" \
                  --name AllowPipelineDeployment \
                  --priority 100 \
                  --access Allow \
                  --direction Inbound \
                  --protocol Tcp \
                  --source-address-prefixes "${agent_ip}/32" \
                  --source-port-ranges '*' \
                  --destination-address-prefixes '*' \
                  --destination-port-ranges 22 8085 \
                  --output none

          - bash: |
              set -euo pipefail
              key="$(sshKey.secureFilePath)"
              host="azureuser@$(VM_PUBLIC_IP)"
              chmod 600 "$key"
              ssh -i "$key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$host" \
                "mkdir -p $(DEPLOY_ROOT)/deployment/docker"
              scp -i "$key" -r deployment/azure "$host:$(DEPLOY_ROOT)/deployment/"
              scp -i "$key" -r deployment/docker/scripts "$host:$(DEPLOY_ROOT)/deployment/docker/"
              ssh -i "$key" "$host" \
                "chmod +x '$(DEPLOY_ROOT)/deployment/azure/deploy.sh' && \
                '$(DEPLOY_ROOT)/deployment/azure/deploy.sh' \
                '$(IMAGE_TAG)' \
                '$(ACR_NAME)' \
                '$(KEY_VAULT_NAME)' \
                '$(DOPPLER_DEPLOY_TOKEN_SECRET)' \
                '$(DOPPLER_APP_TOKEN_SECRET)'"
            displayName: Copy manifests, deploy and verify containers

          - task: AzureCLI@2
            displayName: External smoke test
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                public_ip="$(az vm list-ip-addresses --resource-group "$(AZURE_RESOURCE_GROUP)" --name "$(AZURE_VM_NAME)" --query '[0].virtualMachine.network.publicIpAddresses[0].ipAddress' --output tsv)"
                curl --fail --show-error --retry 12 --retry-delay 10 "http://${public_ip}:8085/actuator/health"

          - task: AzureCLI@2
            displayName: Close temporary SSH access
            condition: always()
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az network nsg rule delete \
                  --resource-group "$(AZURE_RESOURCE_GROUP)" \
                  --nsg-name "$(AZURE_NSG_NAME)" \
                  --name AllowPipelineDeployment \
                  --output none || true

  - stage: StopDemo
    displayName: Stop and deallocate demo VM
    dependsOn: []
    condition: eq('${{ parameters.operation }}', 'stop')
    jobs:
      - job: Stop
        displayName: Deallocate VM
        steps:
          - task: AzureCLI@2
            displayName: Deallocate demo VM
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az vm deallocate \
                  --resource-group "$(AZURE_RESOURCE_GROUP)" \
                  --name "$(AZURE_VM_NAME)" \
                  --no-wait
                echo "VM deallocation requested. Disk and public IP can still consume credit."
