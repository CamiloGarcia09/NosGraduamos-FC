trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - Agent.OS -equals Windows_NT

variables:
  MAVEN_CACHE_FOLDER: '$(Pipeline.Workspace)\.m2\repository'

stages:
  - stage: CI
    displayName: Continuous Integration

    jobs:
      - job: BuildTest
        displayName: Build, test and validate container

        steps:
          # 1. Checkout
          - checkout: self
            clean: true

          # 2. Validar herramientas del agente
          - task: PowerShell@2
            displayName: Validate agent tools
            inputs:
              targetType: inline
              script: |
                Write-Host "=== Java ==="
                java -version
                if ($LASTEXITCODE -ne 0) {
                  throw "Java is not available in the agent PATH."
                }

                Write-Host "=== Maven ==="
                mvn -version
                if ($LASTEXITCODE -ne 0) {
                  throw "Maven is not available in the agent PATH."
                }

                Write-Host "=== Docker ==="
                docker --version
                if ($LASTEXITCODE -ne 0) {
                  throw "Docker CLI is not available in the agent PATH."
                }

                Write-Host "=== Doppler ==="
                doppler --version
                if ($LASTEXITCODE -ne 0) {
                  throw "Doppler CLI is not available in the agent PATH."
                }

          # 3. Cache Maven
          - task: Cache@2
            displayName: Cache Maven dependencies
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(MAVEN_CACHE_FOLDER)

          # 4. Build + Tests con variables de Doppler
          - task: PowerShell@2
            displayName: Build and test with Doppler
            inputs:
              targetType: inline
              script: |
                doppler run -- `
                  mvn -B clean verify `
                  "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)"

                if ($LASTEXITCODE -ne 0) {
                  throw "Maven build or tests failed."
                }
            env:
              DOPPLER_TOKEN: $(DOPPLER_TOKEN)

          # 5. Publicar resultados de pruebas
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: false

          # 6. Validar que Docker Desktop / Engine esté disponible
          - task: PowerShell@2
            displayName: Validate Docker Engine
            inputs:
              targetType: inline
              script: |
                docker info

                if ($LASTEXITCODE -ne 0) {
                  throw "Docker Engine is not running."
                }

          # 7. Construir imagen Docker
          - task: Docker@2
            displayName: Validate Docker image
            inputs:
              command: build
              repository: messageucolab
              Dockerfile: '$(Build.SourcesDirectory)\Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                ci-$(Build.BuildId)