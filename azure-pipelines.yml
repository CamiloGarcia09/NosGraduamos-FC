trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository

stages:
  - stage: CI
    displayName: Continuous Integration

    jobs:
      - job: BuildTest
        displayName: Build, test and validate container

        steps:
          - checkout: self
            clean: true

          # Instalar Doppler CLI
          - script: |
              (curl -Ls --tlsv1.2 --proto "=https" --retry 3 \
              https://cli.doppler.com/install.sh || \
              wget -t 3 -qO- https://cli.doppler.com/install.sh) | sudo sh

              doppler --version
            displayName: Install Doppler CLI

          # Cache de dependencias Maven
          - task: Cache@2
            displayName: Cache Maven dependencies
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(MAVEN_CACHE_FOLDER)

          # Compilar y ejecutar pruebas utilizando las variables de Doppler
          - script: |
              doppler run -- \
                mvn -B clean verify \
                -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)
            displayName: Compile and run tests with Doppler
            env:
              DOPPLER_TOKEN: $(DOPPLER_TOKEN)

          # Publicar resultados de pruebas en Azure DevOps
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              failTaskOnFailedTests: true

          # Validar que el Dockerfile construye correctamente
          - task: Docker@2
            displayName: Validate Docker image
            inputs:
              command: build
              repository: messageucolab
              Dockerfile: Dockerfile
              buildContext: .
              tags: |
                ci-$(Build.BuildId)