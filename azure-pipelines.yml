name: CI - NosGraduamos-FC
 
trigger:
  branches:
    include:
      - main
      - develop
 
pr:
  branches:
    include:
      - main
      - develop
 
pool:
  vmImage: ubuntu-latest
 
variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
 
steps:
  # 1. Instalar Doppler CLI
  - script: |
      (curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh || wget -t 3 -qO- https://cli.doppler.com/install.sh) | sudo sh
    displayName: 'Instalar Doppler CLI'
 
  - task: Cache@2
    displayName: 'Cache repositorio local Maven'
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
      path: $(MAVEN_CACHE_FOLDER)
 
  - task: JavaToolInstaller@0
    displayName: 'Instalar JDK 17'
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
 
  # 2. Descargar e inyectar variables de Doppler en el entorno del Job
  - script: |
      doppler secrets download --no-file --format env-no-quotes > doppler.env
      while IFS= read -r line || [ -n "$line" ]; do
        if [[ ! -z "$line" && ! "$line" =~ ^# ]]; then
          echo "##vso[task.setvariable variable=$(echo "$line" | cut -d '=' -f 1);issecret=true]$(echo "$line" | cut -d '=' -f 2-)"
        fi
      done < doppler.env
      rm -f doppler.env
    displayName: 'Cargar variables de Doppler'
    env:
      DOPPLER_TOKEN: $(DOPPLER_TOKEN)
 
  - task: Maven@3
    displayName: 'Build y tests (core, utils, infrastructure)'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean verify'
      options: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      codeCoverageToolOption: 'JaCoCo'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.17'
      mavenVersionOption: 'Default'
 
  - task: SonarCloudPrepare@2
    displayName: 'Preparar analisis SonarCloud'
    inputs:
      SonarCloud: 'SonarCloud'
      organization: 'CamiloGarcia09'
      scannerMode: 'Other'
      extraProperties: |
        sonar.projectKey=CamiloGarcia09_NosGraduamos-FC
        sonar.projectName=NosGraduamos-FC
        sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
 
  - task: Maven@3
    displayName: 'Ejecutar analisis SonarCloud y validar Quality Gate'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'org.sonarsource.scanner.maven:sonar-maven-plugin:sonar'
      options: >
        -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)
        -Dsonar.qualitygate.wait=true
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.17'
      mavenVersionOption: 'Default'
 
  - task: SonarCloudPublish@2
    displayName: 'Publicar resultado del Quality Gate en el PR'
    inputs:
      pollingTimeoutSec: '300'