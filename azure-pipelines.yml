trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

parameters:
  - name: operation
    displayName: Pipeline operation
    type: string
    default: ci
    values:
      - ci
      - deploy
      - stop

pool:
  name: Default
  demands:
    - Agent.OS -equals Windows_NT

variables:
  - group: messageucolab-cicd
  - name: MAVEN_CACHE_FOLDER
    value: '$(Pipeline.Workspace)\.m2\repository'
  - name: IMAGE_REPOSITORY
    value: messageucolab
  - name: IMAGE_TAG
    value: $(Build.SourceVersion)
  - name: DEPLOY_ROOT
    value: /opt/messageucolab
  - name: DOPPLER_DEPLOY_TOKEN_SECRET
    value: doppler-deploy-token
  - name: DOPPLER_APP_TOKEN_SECRET
    value: doppler-app-token

stages:
  - stage: ValidateAndTest
    displayName: Validate, test and build
    condition: ne('${{ parameters.operation }}', 'stop')
    jobs:
      - job: CI
        displayName: Maven and container validation
        steps:
          - checkout: self
            clean: true

          - task: PowerShell@2
            displayName: Validate agent tools
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = 'Stop'
                docker version
                if ($LASTEXITCODE -ne 0) { throw 'Docker Engine is not available.' }
                az version
                if ($LASTEXITCODE -ne 0) { throw 'Azure CLI is not available.' }
                ssh -V
                if ($LASTEXITCODE -ne 0) { throw 'OpenSSH is not available.' }

          - task: Cache@2
            displayName: Cache Maven dependencies
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(MAVEN_CACHE_FOLDER)

          - task: PowerShell@2
            displayName: Build and test with Java 17 container
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = 'Stop'
                New-Item -ItemType Directory -Force -Path '$(MAVEN_CACHE_FOLDER)' | Out-Null
                docker run --rm `
                  --volume "$(Build.SourcesDirectory):/workspace" `
                  --volume "$(MAVEN_CACHE_FOLDER):/root/.m2/repository" `
                  --workdir /workspace `
                  maven:3.9.9-eclipse-temurin-17-noble `
                  mvn -B clean verify
                if ($LASTEXITCODE -ne 0) { throw 'Maven build or tests failed.' }

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "**/surefire-reports/TEST-*.xml"
              searchFolder: $(System.DefaultWorkingDirectory)
              mergeTestResults: true
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: false

          - task: PowerShell@2
            displayName: Validate Azure Docker Compose
            inputs:
              targetType: inline
              script: |
                docker compose --file deployment/azure/docker-compose.yml config --quiet
                if ($LASTEXITCODE -ne 0) { throw 'Azure Docker Compose is invalid.' }
            env:
              ACR_LOGIN_SERVER: example.azurecr.io
              IMAGE_TAG: validation
              AZURE_KEYVAULT_UCOLAB_ENDPOINT: https://example.vault.azure.net
              DOPPLERTOKEN: validation
              REDISPASSWORD: validation
              PULSARTOPICNAME: persistent://public/default/validation
              SURREALDBUSER: root
              SURREALDBPASSWORD: validation
              SURREALDBNAMESPACE: messageucolab
              SURREALDBDATABASE: messageucolab

          - task: PowerShell@2
            displayName: Validate Bicep
            inputs:
              targetType: inline
              script: |
                az bicep build --file infrastructure/azure/main.bicep --stdout | Out-Null
                if ($LASTEXITCODE -ne 0) { throw 'Bicep validation failed.' }

          - task: PowerShell@2
            displayName: Validate application image
            inputs:
              targetType: inline
              script: |
                docker build --tag "$(IMAGE_REPOSITORY):ci-$(Build.BuildId)" .
                if ($LASTEXITCODE -ne 0) { throw 'Application image build failed.' }

          - task: AzureCLI@2
            displayName: Push application image
            condition: >-
              and(
                succeeded(),
                ne(variables['Build.Reason'], 'PullRequest'),
                or(
                  eq(variables['Build.SourceBranch'], 'refs/heads/develop'),
                  eq('${{ parameters.operation }}', 'deploy')
                )
              )
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $loginServer = "$(ACR_NAME).azurecr.io"
                $commitImage = "${loginServer}/$(IMAGE_REPOSITORY):$(IMAGE_TAG)"
                $buildImage = "${loginServer}/$(IMAGE_REPOSITORY):build-$(Build.BuildId)"
                az acr login --name "$(ACR_NAME)"
                if ($LASTEXITCODE -ne 0) { throw 'ACR login failed.' }
                docker tag "$(IMAGE_REPOSITORY):ci-$(Build.BuildId)" $commitImage
                docker tag "$(IMAGE_REPOSITORY):ci-$(Build.BuildId)" $buildImage
                docker push $commitImage
                if ($LASTEXITCODE -ne 0) { throw 'Commit image push failed.' }
                docker push $buildImage
                if ($LASTEXITCODE -ne 0) { throw 'Build image push failed.' }

  - stage: DeployDemo
    displayName: Deploy demo environment
    dependsOn: ValidateAndTest
    condition: >-
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq('${{ parameters.operation }}', 'deploy')
      )
    jobs:
      - job: Deploy
        displayName: Deploy to the temporary VM
        steps:
          - checkout: self
            clean: true

          - task: DownloadSecureFile@1
            name: sshKey
            displayName: Download temporary SSH key
            inputs:
              secureFile: $(SSH_SECURE_FILE)

          - task: AzureCLI@2
            displayName: Start VM and open temporary SSH access
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $agentIp = (Invoke-RestMethod -Uri 'https://api.ipify.org').Trim()
                az vm start --resource-group "$(AZURE_RESOURCE_GROUP)" --name "$(AZURE_VM_NAME)"
                if ($LASTEXITCODE -ne 0) { throw 'VM start failed.' }
                $publicIp = az vm list-ip-addresses --resource-group "$(AZURE_RESOURCE_GROUP)" --name "$(AZURE_VM_NAME)" --query '[0].virtualMachine.network.publicIpAddresses[0].ipAddress' --output tsv
                if ($LASTEXITCODE -ne 0) { throw 'Could not obtain the VM public IP.' }
                Write-Host "##vso[task.setvariable variable=VM_PUBLIC_IP]$publicIp"
                az network nsg rule create `
                  --resource-group "$(AZURE_RESOURCE_GROUP)" `
                  --nsg-name "$(AZURE_NSG_NAME)" `
                  --name AllowPipelineDeployment `
                  --priority 100 `
                  --access Allow `
                  --direction Inbound `
                  --protocol Tcp `
                  --source-address-prefixes "$agentIp/32" `
                  --source-port-ranges '*' `
                  --destination-address-prefixes '*' `
                  --destination-port-ranges 22 8085 `
                  --output none
                if ($LASTEXITCODE -ne 0) { throw 'Could not create temporary NSG access.' }

          - task: PowerShell@2
            displayName: Copy deployment files
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = 'Stop'
                $key = '$(sshKey.secureFilePath)'
                $remoteHost = 'azureuser@$(VM_PUBLIC_IP)'
                $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
                $keyAcl = New-Object System.Security.AccessControl.FileSecurity
                $keyAcl.SetAccessRuleProtection($true, $false)
                $keyAcl.SetOwner($identity.User)
                $keyRule = [System.Security.AccessControl.FileSystemAccessRule]::new(
                  $identity.User,
                  [System.Security.AccessControl.FileSystemRights]::FullControl,
                  [System.Security.AccessControl.AccessControlType]::Allow
                )
                $keyAcl.AddAccessRule($keyRule)
                Set-Acl -LiteralPath $key -AclObject $keyAcl
                ssh -i $key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 $remoteHost `
                  "mkdir -p $(DEPLOY_ROOT)/deployment/docker"
                if ($LASTEXITCODE -ne 0) { throw 'SSH connection failed.' }
                scp -i $key -r deployment/azure "${remoteHost}:$(DEPLOY_ROOT)/deployment/"
                if ($LASTEXITCODE -ne 0) { throw 'Could not copy Azure deployment files.' }
                scp -i $key -r deployment/docker/scripts "${remoteHost}:$(DEPLOY_ROOT)/deployment/docker/"
                if ($LASTEXITCODE -ne 0) { throw 'Could not copy initialization scripts.' }

          - task: AzureCLI@2
            displayName: Deploy and verify containers
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $deployCommand = "chmod +x '$(DEPLOY_ROOT)/deployment/azure/deploy.sh' && sudo -u azureuser -H '$(DEPLOY_ROOT)/deployment/azure/deploy.sh' '$(IMAGE_TAG)' '$(ACR_NAME)' '$(KEY_VAULT_NAME)' '$(DOPPLER_DEPLOY_TOKEN_SECRET)' '$(DOPPLER_APP_TOKEN_SECRET)'"
                $result = az vm run-command invoke `
                  --resource-group "$(AZURE_RESOURCE_GROUP)" `
                  --name "$(AZURE_VM_NAME)" `
                  --command-id RunShellScript `
                  --scripts $deployCommand `
                  --query 'value[0].message' `
                  --output tsv
                if ($LASTEXITCODE -ne 0) { throw 'Remote deployment failed.' }
                Write-Host $result
                if ($result -notmatch 'Deployment completed with image tag') {
                  throw 'Remote deployment did not report success.'
                }

          - task: AzureCLI@2
            displayName: External smoke test
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $response = Invoke-RestMethod -Uri 'http://$(VM_PUBLIC_IP):8085/actuator/health' -TimeoutSec 30
                if ($response.status -ne 'UP') { throw 'Application health check did not return UP.' }
                Write-Host "Application health: $($response.status)"

          - task: AzureCLI@2
            displayName: Close temporary SSH access
            condition: always()
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                az network nsg rule delete `
                  --resource-group "$(AZURE_RESOURCE_GROUP)" `
                  --nsg-name "$(AZURE_NSG_NAME)" `
                  --name AllowPipelineDeployment `
                  --output none
                exit 0

  - stage: StopDemo
    displayName: Stop and deallocate demo VM
    dependsOn: []
    condition: eq('${{ parameters.operation }}', 'stop')
    jobs:
      - job: Stop
        displayName: Deallocate VM
        steps:
          - task: AzureCLI@2
            displayName: Deallocate demo VM
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                az vm deallocate `
                  --resource-group "$(AZURE_RESOURCE_GROUP)" `
                  --name "$(AZURE_VM_NAME)" `
                  --no-wait
                if ($LASTEXITCODE -ne 0) { throw 'VM deallocation request failed.' }
                Write-Host 'VM deallocation requested. Disk and public IP can still consume credit.'
